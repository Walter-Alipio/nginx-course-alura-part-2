server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # regular expression
    location ~ \.php$ {
        proxy_pass http://localhost:8000
    }

    error_page 404 400 401 /html/error.html;
    # location /api {
    #     proxy_pass http://backend:3000
    # }

    # location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
    #     expires 1y;
    #     add_header Cache-Control "public, imutable";
    # }
}