server {
    listen 8005;
    server_name localhost;

    root /usr/share/nginx/performance;
    index index.html;

    gzip on;
    gzip_types text/css;

    add_header keep_Alive "timeout=5, max=1000";

    location ~ \.jpg$ {
        expires 30d;
        add_header Cache-Control public;
    }
}

server {
    listen 443 ssl;
    ssl_certificate /usr/share/localssl/ssl/localhost.crt;
    ssl_certificate_key /usr/share/localssl/ssl/localhost.key;
    location / {
        proxy_pass http://localhost:8005;
    }
}